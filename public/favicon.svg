<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="nf-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Contenedor / Ventana de Terminal -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#nf-bg)" />

  <!-- Barra superior sutil de consola con puntos -->
  <circle cx="16" cy="16" r="2.5" fill="#ffffff" fill-opacity="0.4" />
  <circle cx="23" cy="16" r="2.5" fill="#ffffff" fill-opacity="0.4" />
  <circle cx="30" cy="16" r="2.5" fill="#ffffff" fill-opacity="0.4" />

  <!-- Línea divisoria tenue -->
  <line x1="4" y1="23" x2="60" y2="23" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Prompt de consola: Símbolo > (Chevron) -->
  <path d="M16 31L27 40L16 49" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cursor titilante de consola: Símbolo _ -->
  <line x1="33" y1="48" x2="48" y2="48" stroke="url(#nf-accent)" stroke-width="5" stroke-linecap="round" />
</svg>